server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Log general del bot ─────────────────────────────────────────────
  - job_name: "tradingbot_general"
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "tradingbot"
          category: "general"
          __path__: "/var/log/tradingbot/general/*.log"

  # ── Movimientos (long/short, entradas, salidas) ─────────────────────
  - job_name: "tradingbot_movements"
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "tradingbot"
          category: "movement"
          __path__: "/var/log/tradingbot/movements/*.log"

  # ── Balance y P&L ───────────────────────────────────────────────────
  - job_name: "tradingbot_balance"
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "tradingbot"
          category: "balance"
          __path__: "/var/log/tradingbot/balance/*.log"

  # ── Errores y alertas ───────────────────────────────────────────────
  - job_name: "tradingbot_errors"
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "tradingbot"
          category: "error"
          __path__: "/var/log/tradingbot/errors/*.log"

  # ── Señales del modelo ──────────────────────────────────────────────
  - job_name: "tradingbot_signals"
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "tradingbot"
          category: "signal"
          __path__: "/var/log/tradingbot/signals/*.log"

  # ── Pipeline de features ────────────────────────────────────────────
  - job_name: "tradingbot_features"
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "tradingbot"
          category: "features"
          __path__: "/var/log/tradingbot/features/*.log"

    # parsea JSON si logueas en JSON (recomendado)
    pipeline_stages:
      - json:
          expressions:
            level: level
            ticker: ticker
            direction: direction
      - labels:
          level:
          ticker:
          direction: