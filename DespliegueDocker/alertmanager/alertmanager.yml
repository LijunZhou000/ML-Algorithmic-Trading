global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'webhook'

  routes:
    # Las alertas con label 'severity: critical' se envían al webhook (webhook.site)
    - match:
        severity: 'critical'
      receiver: 'webhook'
    # Por defecto, otras alertas también usan 'webhook'

receivers:
  - name: 'webhook'
    webhook_configs:
      - url: 'https://webhook.site/your-uuid-here'

  - name: 'discord'
    webhook_configs:
      - url: 'https://discordapp.com/api/webhooks/YOUR_DISCORD_WEBHOOK_URL'

  - name: 'email'
    email_configs:
      - to: 'your-email@example.com'
        from: 'alertmanager@example.com'
        smarthost: 'smtp.example.com:587'
        auth_username: 'your-smtp-username'
        auth_password: 'your-smtp-password'
        auth_identity: 'your-email@example.com'

# Nota: reemplaza 'https://webhook.site/your-uuid-here' por la URL que te
# proporciona https://webhook.site/ para recibir las notificaciones.
