services:
  tradingbot:
    build:
      context: ..
      dockerfile: DespliegueDocker/tradingbot/Dockerfile
    image: mlalgotrading/tradingbot:latest
    container_name: tradingbot
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: "UTC"
    volumes:
      - ../TradingBots:/app/TradingBots:rw
      - ../Data:/app/Data:rw
      - ./tradingbot_logs:/var/log/tradingbot:rw   # bind mount, sin named volume abajo
    working_dir: /app/TradingBots
    command: /bin/bash
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - mlnet

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./grafana_db:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_password
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - mlnet                        # ← faltaba, no veía loki ni prometheus

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus:ro   # ← config en DespliegueDocker/prometheus/
      - prometheus_data:/prometheus        # datos persistentes
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "127.0.0.1:9090:9090"             # no exponer al exterior sin auth
    networks:
      - mlnet

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - mlnet

  pushgateway:
    image: prom/pushgateway:latest         # ← imagen oficial
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9091"             # solo local, no necesita volumen
    networks:
      - mlnet

  loki:
    image: grafana/loki:2.9.10
    container_name: loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro   # ← carpeta loki/
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/loki-config.yaml
    networks:
      - mlnet

  promtail:
    image: grafana/promtail:2.9.10
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro  # ← carpeta promtail/
      - ./tradingbot_logs:/var/log/tradingbot:ro
    command:
      - -config.file=/etc/promtail/config.yml
    networks:
      - mlnet
    depends_on:
      - loki

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always
    networks:
      - mlnet
  
  db-init:
    image: postgres:13
    depends_on:
      - postgres
    entrypoint: >
      sh -c "sleep 5 && psql postgresql://airflow:airflow@postgres:5432/airflow -f /scripts/create_demo_table.sql"
    volumes:
      - ./db:/scripts
    networks:
      - mlnet

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
    entrypoint: >
      /entrypoint.sh
    depends_on:
      - postgres
    networks:
      - mlnet
  
  # --- Contenedores auxiliares para pruebas (generadores) -----------------
  test_pushgenerator:
    build:
      context: ./tests
      dockerfile: Dockerfile.pushgateway
    image: mlalgotrading/test-pushgateway:latest
    container_name: test_pushgateway
    restart: unless-stopped
    networks:
      - mlnet
    depends_on:
      - pushgateway

  test_loggenerator:
    build:
      context: ./tests
      dockerfile: Dockerfile.loki_generator
    image: mlalgotrading/test-loggenerator:latest
    container_name: test_loggenerator
    restart: unless-stopped
    volumes:
      - ./tradingbot_logs:/var/log/tradingbot:rw
    environment:
      - PUSHGATEWAY_URL=http://pushgateway:9091
      - INSTANCE=test_loggenerator
    networks:
      - mlnet
    depends_on:
      - promtail

  test_sqlwriter:
    build:
      context: ./tests
      dockerfile: Dockerfile.sql_writer
    image: mlalgotrading/test-sqlwriter:latest
    container_name: test_sqlwriter
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=airflow
      - PGUSER=airflow
      - PGPASSWORD=airflow
      - INSTANCE=test_sqlwriter
    networks:
      - mlnet
    depends_on:
      - postgres

  sql_pusher:
    build:
      context: ./sql_exporter
      dockerfile: Dockerfile
    image: mlalgotrading/sql-pusher:latest
    container_name: sql_pusher
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=airflow
      - PGUSER=airflow
      - PGPASSWORD=airflow
      - PUSHGATEWAY_URL=http://pushgateway:9091
      - METRIC_NAME=demo_metric
      - INTERVAL=30
      - LIMIT=10
      - JOB_NAME=sql_avg_job
    networks:
      - mlnet
    depends_on:
      - postgres
      - pushgateway

networks:
  mlnet:
    driver: bridge

volumes:
  prometheus_data:   # métricas históricas de prometheus
  loki_data:         # índices y chunks de loki
  alertmanager_data:
  db:
  pgadmin_data:
  # tradingbot_logs NO va aquí → es bind mount desde ./tradingbot_logs